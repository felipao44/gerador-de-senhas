<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=devie-width">
    <title>Document</title>
</head>

<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="cadeado.png" alt="cadeado fechado">
            <h1 class="titulo-principal">Gerador de senhas</h1>
            <h2 class="titulo-secundario">gere uma senha aleatoriae segura</h2>

            <div class="conteudo-senha">
                <label for="senha">Senha</label>
                <input name="senha" type="tect" id="campo-senha">

                <div class="parametro">
                    <h3 class="parametro-titulo">Personalize a sua senha</h3>
                    <div class="parametro-coluna__senha"></div>
                    <div class="parametro-senha"></div>
                    <h4 class="parametro-senha__titulo">Número de caracteres</h4>

                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha__botao">-</button>
                        <p class="parametro-senha__texto">12</p>
                        <button class="parametro-senha__botao">+</button>
                    </div>

                </div>
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Caracteristicas das senha</h4>
                </div>

                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Força da senha</h4>
                </div>
            </div>
        </div>
    </section>
